services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: learnix
      POSTGRES_USER: learnix
      POSTGRES_PASSWORD: learnix
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
