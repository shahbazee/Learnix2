{% extends 'base.html' %}

{% block title %}{% if object %}Edit Course{% else %}Create Course{% endif %}{% endblock %}

{% block content %}
<h2>{% if object %}Edit Course{% else %}Create Course{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Save{% else %}Create{% endif %}</button>
</form>
{% endblock %}
